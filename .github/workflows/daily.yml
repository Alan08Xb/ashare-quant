name: daily-a-share-quant

on:
  schedule:
    # 每个交易日早上 09:45（北京时间 = UTC 01:45）运行
    # 注意：09:15 集合竞价刚开盘，快照接口的“最新价”字段可能仍为空导致清洗后 0 只，
    #       推迟到 09:45 连续竞价数据稳定后再跑。cron 周一至周五(1-5)，
    #       节假日因“无数据”自然跳过（"无数据"时步骤退出、不推送、不提交）。
    - cron: '45 1 * * 1-5'
  workflow_dispatch: {}   # 允许在 Actions 页手动点击运行

permissions:
  contents: write   # 推送报告/历史数据到仓库

concurrency:
  group: a-share-quant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install .

      - name: 运行选股（生成报告供推送，结果不提交到仓库）
        env:
          TOPN: '50'            # 输出 Top 50
          DEEP_TOP: '50'        # 对综合分前 50 名做深度校验
          MIN_AMOUNT: '50000000' # 成交额下限 5000 万
          # —— 可选：AI 解读。AI_API_KEY 请放在 仓库 Settings→Secrets→Actions，
          #    名称为 AI_API_KEY；留空则跳过 AI 步骤（不报错）。
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python -m ashare_quant run

      # 只提交 docs/（GitHub Pages 公开网页报告）。
      # reports/ 与 data/history/ 是隐私，永不提交。仅当选股成功才提交，
      # 休市/无数据时 run 退出、本步不执行，不会用空报告覆盖上一份。
      - name: 提交并推送网页报告
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "今天没有变化，跳过提交"; exit 0
          fi
          git commit -m "每日选股网页报告 $(date -u +%F)"
          git push

      # 仅当选股成功才推送到飞书（休市/无数据时 run 退出，本步不执行）
      - name: 推送到飞书（可选）
        if: success() && env.FEISHU_WEBHOOK != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m ashare_quant feishu