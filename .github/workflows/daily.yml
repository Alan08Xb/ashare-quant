name: daily-a-share-quant

on:
  # 触发来源：NAS Hermes cron（每个交易日 10:00）先跑东财拉取任务落库 data/dailydb/，
  # 再 workflow_dispatch 触发本分析任务。分析任务先查当日数据仓库：新鲜则 100% 从库拉取
  # （纯本地、秒级）；不新鲜（东财拉取失败）则降级新浪+baostock。
  # 注意：不再用 GitHub schedule——它对不活跃仓库会延迟 7-8 小时（曾导致每天 17:00-18:00
  # 才推送）。统一由 NAS 准点 dispatch。
  workflow_dispatch: {}   # 允许在 Actions 页手动点击运行，也由 NAS 定时触发

permissions:
  contents: write   # 推送报告/历史数据到仓库

concurrency:
  group: a-share-quant
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install .

      - name: 运行选股（生成报告供推送，结果不提交到仓库）
        env:
          TOPN: '50'            # 输出 Top 50
          DEEP_TOP: '50'        # 对综合分前 50 名做深度校验
          MIN_AMOUNT: '50000000' # 成交额下限 5000 万
          # —— 可选：AI 解读。AI_API_KEY 请放在 仓库 Settings→Secrets→Actions，
          #    名称为 AI_API_KEY；留空则跳过 AI 步骤（不报错）。
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          # 东财高峰会突发 502，抓全市场快照可能失败。这里整体重试：
          # 失败后等 90 秒再跑（风暴通常一两分钟就过），最多 3 次。
          for i in 1 2 3; do
            echo "== 选股尝试 $i/3 =="
            if python -m ashare_quant run; then
              echo "选股成功"; exit 0
            fi
            echo "第 $i 次失败，90 秒后重试..."
            sleep 90
          done
          echo "3 次都失败"; exit 1

      # 提交 docs/（GitHub Pages 公开网页报告）与 data/static/（静态基本面库）。
      # 静态库是东财故障日的降级恢复资产，必须随仓库提交才能在 Actions 运行间存活
      # （每个 run 是全新临时机）。data/static 只有公开市场数据，无隐私，可安全提交。
      # reports/ 与 data/history/ 是隐私，永不提交。仅当选股成功才提交，
      # 休市/无数据时 run 退出、本步不执行，不会用空报告覆盖上一份。
      - name: 提交并推送网页报告
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ data/static/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "今天没有变化，跳过提交"; exit 0
          fi
          git commit -m "每日选股网页报告 $(date -u +%F)"
          git push

      # 仅当选股成功才推送到飞书（休市/无数据时 run 退出，本步不执行）
      - name: 推送到飞书（可选）
        if: success() && env.FEISHU_WEBHOOK != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m ashare_quant feishu