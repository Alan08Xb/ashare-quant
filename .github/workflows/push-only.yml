name: push-only-feishu

# 只推送：读仓库里已有的 reports/latest.json，用 FEISHU_WEBHOOK 发到飞书。
# 不抓数据、不碰东财接口，用于手动验证推送格式（在 Actions 页 Run workflow）。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install .

      - name: 推送已有结果到飞书
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python -m ashare_quant feishu